# EndoAI Vision Training Configuration

project:
  name: "EndoAI Vision Training Pipeline"
  seed: 42
  device: "cuda" # Fallback to cpu automatically if CUDA unavailable

dataset:
  raw_dir: "./datasets/raw"
  processed_dir: "./datasets/processed"
  annotations_dir: "./datasets/annotations"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  patient_level_split: true

detector:
  base_model: "yolov8n.pt"
  epochs: 50
  batch_size: 16
  img_size: 640
  lr: 0.001
  save_dir: "./models/detector"

classifier:
  architecture: "resnet50"
  num_classes: 6
  epochs: 30
  batch_size: 32
  img_size: 224
  lr: 0.0001
  weight_decay: 0.0001
  save_dir: "./models/classifier"
